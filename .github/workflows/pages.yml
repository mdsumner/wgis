name: Deploy to GitHub Pages

# main is built into the root of the gh-pages branch; pull request
# previews live beside it under pr-preview/ (see preview.yml), so this
# deploy leaves that folder alone. Pages serves the gh-pages branch
# (Settings > Pages > Source: Deploy from a branch, gh-pages, / (root)).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false
