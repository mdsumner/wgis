<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wgis</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #app canvas.overlay {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      #edit-hint {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        max-width: 80%;
        padding: 4px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: #eee;
        font: 12px sans-serif;
        pointer-events: none;
        z-index: 5;
      }
      #controls button.on {
        background: #3a6ea5;
        color: #fff;
      }
      #controls .prop-row label {
        width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #controls .prop-row input[type="text"] {
        width: 140px;
      }
      #app.dropping {
        outline: 3px dashed #9cf;
        outline-offset: -3px;
      }
      .swatch {
        width: 22px;
        height: 14px;
        padding: 0;
        border: none;
        background: none;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        z-index: 100;
        max-width: 460px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        box-sizing: border-box;
        border-radius: 4px;
      }
      #controls input[type="text"] {
        width: 280px;
        padding: 4px;
        font-family: monospace;
        font-size: 11px;
        margin: 5px 0;
      }
      #controls input.small {
        width: 50px;
      }
      #controls input.crs {
        width: 120px;
      }
      #controls input.extent {
        width: 280px;
      }
      #vertex-count {
        color: #aaa;
        font-size: 10px;
      }
      #controls button {
        padding: 4px 8px;
        cursor: pointer;
        font-family: monospace;
      }
      #controls label {
        display: inline-block;
        width: 45px;
        text-align: right;
        margin-right: 4px;
      }
      .control-row {
        margin: 4px 0;
      }
      #info {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
      }
      #layers {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
      }
      .layer-item {
        flex-wrap: wrap;
      }
      .alpha-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0 1px 40px;
        font-size: 10px;
        color: #aaa;
      }
      .alpha-row input[type="range"] {
        width: 120px;
        margin: 0;
      }
      .layer-item {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 0;
        font-size: 10px;
      }
      .layer-item button {
        padding: 1px 4px;
        font-size: 10px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title-row a {
        color: #9cf;
        font-size: 10px;
      }
      .title-row .links {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .title-row .links button {
        font-size: 10px;
        padding: 1px 5px;
      }
      #controls.collapsed fieldset,
      #controls.collapsed #info {
        display: none;
      }
      #controls select {
        font-family: monospace;
        font-size: 11px;
        padding: 3px;
        max-width: 280px;
      }
      #wmts-layer {
        max-width: 200px;
      }
      #wmts-picker input.small {
        width: 70px;
      }
      #controls input.small {
        width: 60px;
      }
      #controls label.wide {
        width: auto;
        text-align: left;
      }
      .scale-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 0 2px 40px;
        font-size: 10px;
      }
      .scale-row canvas.hist {
        width: 200px;
        height: 36px;
        border: 1px solid #555;
        cursor: ew-resize;
        touch-action: none;
      }
      .scale-row .hist-legend {
        display: inline-block;
        width: 200px;
        height: 8px;
        border: 1px solid #666;
      }
      .scale-row label.wide {
        width: auto;
        color: #aaa;
      }
      #controls .scale-row input.num.tiny {
        width: 44px;
      }
      #controls .scale-row input.num {
        width: 64px;
        font-size: 10px;
        padding: 2px;
        margin: 0;
      }
      .scale-row select {
        font-size: 10px;
        padding: 1px;
        max-width: 110px;
      }
      .scale-row button {
        font-size: 10px;
        padding: 1px 4px;
      }
      .attribution {
        color: #888;
        font-size: 9px;
        padding-left: 40px;
      }
      .hint {
        color: #aaa;
        font-size: 10px;
      }
      .crs-string {
        display: inline-block;
        max-width: 380px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #info {
        user-select: text;
      }
      fieldset {
        border: 1px solid #444;
        padding: 6px;
        margin: 6px 0;
      }
      legend {
        padding: 0 4px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CLhznswB.js"></script>
  </head>
  <body>
    <div id="controls">
      <div class="title-row">
        <strong>wgis</strong>
        <a href="https://github.com/mdsumner/wgis" target="_blank" rel="noopener">source</a>
        <span class="links">
          <button id="link-btn" title="Put a link to this view, layers and all, in the address bar and on the clipboard">link</button>
          <button id="reset-btn" title="Start again with the defaults">reset</button>
          <button id="panel-toggle" title="Collapse/expand panel">_</button>
        </span>
      </div>
      
      <fieldset>
        <legend>Display</legend>
        <div class="control-row">
          <label>Mode:</label>
          <select id="mode">
            <option value="fixed">fixed extent</option>
            <option value="centred">centred projection</option>
          </select>
        </div>
        <div id="fixed-panel">
          <div class="control-row">
            <label>CRS:</label>
            <input type="text" id="display-crs" class="crs" value="EPSG:3857" />
          </div>
          <div class="control-row">
            <label>Extent:</label>
            <input type="text" id="extent" class="extent" value="-40000000,40000000,-40000000,40000000" />
          </div>
        </div>
        <div id="centred-panel" hidden>
          <div class="control-row">
            <label>Proj:</label>
            <select id="proj"></select>
          </div>
          <div class="control-row">
            <label></label>
            <input type="text" id="proj-template" class="extent" hidden
                   placeholder="+proj=... +lon_0={lon_0} +lat_0={lat_0} +x_0=0 +y_0=0 +ellps=WGS84 +units=m" />
          </div>
          <div class="control-row">
            <label>Centre:</label>
            <input type="text" id="centre-lon" class="small" value="0" title="longitude" />
            <input type="text" id="centre-lat" class="small" value="-90" title="latitude" />
            <span class="hint">lon, lat (drag the map to move it; shift-drag looks around without re-centring)</span>
          </div>
          <div class="control-row">
            <label for="recentre">Re-centre:</label>
            <select id="recentre" title="when a drag moves the projection centre">
              <option value="auto">auto (live on proj4js, on release on PROJ)</option>
              <option value="live">live, while dragging</option>
              <option value="release">on release</option>
            </select>
          </div>
        </div>
        <div class="control-row">
          <label for="engine">Engine:</label>
          <select id="engine" title="mesh: GPU-interpolated texture, free while panning; warp: every screen pixel resampled by rwarp in a worker">
            <option value="mesh">mesh (GPU interpolation)</option>
            <option value="warp">warp (rwarp resampling)</option>
          </select>
          <select id="warp-alg" title="resampling kernel for the warp engine">
            <option value="nearest">nearest</option>
            <option value="bilinear" selected>bilinear</option>
            <option value="cubic">cubic</option>
            <option value="lanczos">lanczos</option>
          </select>
          <input type="number" id="warp-scale" class="small" value="1" min="0.1" max="2" step="0.1" title="warp pixels per screen pixel; 0.5 is four times faster" />
        </div>
        <div class="control-row">
          <label>Grid:</label>
          <input type="number" id="grid-size" class="small" value="64" min="4" max="256" />
          <span id="vertex-count">(4225 verts)</span>
          <button id="apply-crs-btn">Apply</button>
        </div>
        <div class="control-row">
          <label></label>
          <input type="checkbox" id="graticule" checked />
          <label for="graticule" class="wide">graticule</label>
          <input type="checkbox" id="wireframe" />
          <label for="wireframe" class="wide">show triangles</label>
          <input type="checkbox" id="wrap" />
          <label for="wrap" class="wide" title="repeat the world sideways, where the projection has a repeat">wrap</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Layers</legend>
        <input type="text" id="cog-url" placeholder="COG, {z}/{x}/{y}, WMTS GetCapabilities, or .geojson/.fgb/.parquet URL" />
        <button id="load-btn">Load</button>
        <button id="add-btn">Add</button>
        <div class="control-row">
          <label>Preset:</label>
          <select id="tile-preset"><option value="">presets...</option></select>
        </div>
        <div class="control-row">
          <label>Vector:</label>
          <select id="vector-sample"><option value="">samples...</option></select>
          <input type="file" id="vector-file" accept=".geojson,.json,.fgb,.parquet,.geoparquet" multiple hidden />
          <button id="vector-file-btn" title="GeoJSON, FlatGeobuf or GeoParquet from this computer">open file</button>
          <span class="hint">or drop files on the map</span>
        </div>
        <div id="wmts-picker" hidden>
          <div class="control-row">
            <label>Layer:</label>
            <input type="text" id="wmts-filter" class="small" placeholder="filter" />
            <select id="wmts-layer"></select>
          </div>
          <div class="control-row">
            <label>Matrix:</label>
            <select id="wmts-tms"></select>
          </div>
          <div class="control-row" id="wmts-time-row" hidden>
            <label>Time:</label>
            <input type="text" id="wmts-time" class="crs" />
            <span class="hint" id="wmts-time-hint"></span>
          </div>
          <div class="control-row">
            <label></label>
            <button id="wmts-load-btn">Load</button>
            <button id="wmts-add-btn">Add</button>
            <span class="hint" id="wmts-count"></span>
          </div>
        </div>
        <div id="layers"></div>
      </fieldset>

      <fieldset>
        <legend>Edit</legend>
        <div class="control-row edit-modes">
          <button data-emode="pan" title="drag to pan (every mode pans with a drag)">pan</button>
          <button data-emode="select" title="click to select, shift-click to add, drag to move">select</button>
          <button data-emode="point" title="click to add points">point</button>
          <button data-emode="line" title="click vertices, double-click or Enter to finish">line</button>
          <button data-emode="polygon" title="click vertices, double-click or Enter to close">polygon</button>
          <button data-emode="vertex" title="move, add and remove vertices of the selection">vertices</button>
        </div>
        <div class="control-row">
          <button id="edit-undo" title="Ctrl+Z">undo</button>
          <button id="edit-redo" title="Ctrl+Y or Ctrl+Shift+Z">redo</button>
          <button id="edit-delete" title="Delete">delete</button>
          <button id="edit-copy" title="Ctrl+C: copies keep their CRS">copy</button>
          <button id="edit-paste" title="Ctrl+V: into the active layer, converted to its CRS">paste</button>
          <button id="edit-paste-new" title="Ctrl+Shift+V: a new layer in the CRS the features came from">paste as layer</button>
        </div>
        <div class="control-row">
          <input type="checkbox" id="edit-keep-shape" checked />
          <label for="edit-keep-shape" class="wide" title="on: edges are densified so the pasted shape is the same shape; off: only vertices move, and edges become straight in the target CRS">paste keeps shape</label>
        </div>
        <div class="control-row">
          <input type="text" id="new-layer-crs" class="crs" placeholder="CRS" />
          <button id="new-layer-btn" title="a temporary layer to draw or paste into">new layer</button>
        </div>
        <div id="edit-status" class="hint"></div>
        <div id="edit-props"></div>
      </fieldset>
      
      <div id="info"></div>
    </div>
    <div id="app"><div id="edit-hint" hidden></div></div>
  </body>
</html>
